  <body class="bg-black text-cyan-400 select-none overflow-hidden touch-manipulation">
    <div id="root"></div>
    <script>
      // Gracefully prevent noisy console errors from benign HMR websocket drops in iframe environments
      window.addEventListener('error', function(e) {
        if (e && (e.message?.includes('WebSocket') || e.filename?.includes('@vite/client'))) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e && (e.reason?.message?.includes('WebSocket') || e.reason?.message?.includes('vite'))) {
          e.stopImmediatePropagation();
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
