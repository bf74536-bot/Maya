<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#083344" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#020617" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#22d3ee"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="hologramGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark futuristic background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)"/>
  
  <!-- Outer Cyber Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#0e7490" stroke-width="3" stroke-dasharray="16 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#06b6d4" stroke-width="4" stroke-dasharray="60 12 18 12" filter="url(#hologramGlow)"/>
  
  <!-- Tech Target Marks -->
  <line x1="256" y1="36" x2="256" y2="76" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="436" x2="256" y2="476" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <line x1="36" y1="256" x2="76" y2="256" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <line x1="436" y1="256" x2="476" y2="256" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Inner Rotating Segments -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="80 30" filter="url(#hologramGlow)"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#0284c7" stroke-width="6" stroke-dasharray="40 15 20 15"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#22d3ee" stroke-width="3"/>
  
  <!-- Reactor Core -->
  <circle cx="256" cy="256" r="54" fill="url(#coreGlow)" filter="url(#hologramGlow)"/>
  <circle cx="256" cy="256" r="24" fill="#ffffff" filter="url(#hologramGlow)"/>
  
  <!-- Angular Sci-fi Triangles -->
  <polygon points="256,125 264,140 248,140" fill="#22d3ee"/>
  <polygon points="256,387 264,372 248,372" fill="#22d3ee"/>
  <polygon points="125,256 140,248 140,264" fill="#22d3ee"/>
  <polygon points="387,256 372,248 372,264" fill="#22d3ee"/>
</svg>
